<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>¿Eres fiel?</title>


    <style>

        /* ==============================
           CONFIGURACIÓN GENERAL
        ============================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #ff758c,
                #ff7eb3
            );

            overflow: hidden;
        }


        /* ==============================
           CONTENEDOR PRINCIPAL
        ============================== */

        .contenedor {

            width: 90%;

            max-width: 600px;

            padding: 50px;

            text-align: center;

            background: white;

            border-radius: 25px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.3);
        }


        /* ==============================
           PREGUNTA
        ============================== */

        h1 {

            color: #333;

            font-size: 42px;

            margin-bottom: 40px;
        }


        /* ==============================
           BOTONES
        ============================== */

        .botones {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 25px;

            min-height: 100px;
        }


        button {

            border: none;

            padding: 15px 35px;

            border-radius: 12px;

            font-size: 20px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.4s ease,
                opacity 0.4s ease;
        }


        /* BOTÓN SÍ */

        #si {

            background-color: #4CAF50;

            color: white;
        }


        #si:hover {

            transform: scale(1.05);
        }


        /* BOTÓN NO */

        #no {

            background-color: #f44336;

            color: white;

            transform: scale(1);
        }


        /* ==============================
           PANTALLA FINAL
        ============================== */

        #resultado {

            display: none;

            position: fixed;

            inset: 0;

            width: 100%;

            height: 100vh;

            justify-content: center;

            align-items: center;

            text-align: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }


        /* ==============================
           MENSAJE FINAL
        ============================== */

        .mensaje {

            width: 90%;

            max-width: 650px;

            padding: 45px;

            background: white;

            border-radius: 25px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.4);
        }


        .emoji {

            font-size: 60px;

            margin-bottom: 15px;
        }


        .mensaje h2 {

            margin: 0 0 15px 0;

            color: #e53935;

            font-size: 42px;
        }


        .mensaje p {

            margin: 0;

            color: #333;

            font-size: 24px;
        }


        /* ==============================
           CELULARES
        ============================== */

        @media (max-width: 600px) {

            .contenedor {

                padding: 35px 20px;
            }


            h1 {

                font-size: 32px;
            }


            button {

                padding: 13px 25px;

                font-size: 18px;
            }


            .mensaje h2 {

                font-size: 32px;
            }


            .mensaje p {

                font-size: 20px;
            }
        }

    </style>

</head>


<body>


<!-- =================================
     PANTALLA DE LA PREGUNTA
================================== -->

<div
        class="contenedor"
        id="contenedor">


    <h1 id="pregunta">

        ¿Eres fiel?

    </h1>


    <div class="botones">


        <button id="si">

            Sí

        </button>


        <button id="no">

            No

        </button>


    </div>


</div>



<!-- =================================
     PANTALLA DEL RESULTADO
================================== -->

<div id="resultado">


    <div class="mensaje">


        <div class="emoji">

            😂

        </div>


        <h2>

            ¡Ya se sabía que no eras! XDd

        </h2>



    </div>


</div>



<!-- =================================
     JAVASCRIPT
================================== -->

<script>


    /* ==============================
       OBTENER ELEMENTOS
    ============================== */

    const botonSi =
        document.getElementById("si");


    const botonNo =
        document.getElementById("no");


    const pregunta =
        document.getElementById("pregunta");


    const contenedor =
        document.getElementById("contenedor");


    const resultado =
        document.getElementById("resultado");



    /* ==============================
       VARIABLES
    ============================== */

    let tamañoNo = 1;

    let cantidadSi = 0;



    /* ==============================
       PREGUNTAS
    ============================== */

    const preguntas = [

        "¿Eres fiel? ️",

        "¿Seguro que eres fiel? 👀",

        "¿De verdad eres fiel?",

        "¿en serio?",

        "De verdad?",

        "Segura?"

    ];



    /* ==============================
       BOTÓN SÍ
    ============================== */

    botonSi.addEventListener(
        "click",
        function () {


            /* Contar cuántas veces
               presionó Sí */

            cantidadSi++;



            /* ==========================
               AGRANDAR BOTÓN NO
            ========================== */

            tamañoNo += 0.35;


            botonNo.style.transform =
                `scale(${tamañoNo})`;



            /* ==========================
               CAMBIAR PREGUNTA
            ========================== */

            const indice =
                Math.min(
                    cantidadSi,
                    preguntas.length - 1
                );


            pregunta.textContent =
                preguntas[indice];



            /* ==========================
               HACER PEQUEÑO EL BOTÓN SÍ
            ========================== */

            if (cantidadSi >= 4) {


                const tamañoSi =
                    Math.max(
                        0.4,
                        1 -
                        ((cantidadSi - 3) * 0.15)
                    );


                botonSi.style.transform =
                    `scale(${tamañoSi})`;

            }

        }
    );



    /* ==============================
       BOTÓN NO
    ============================== */

    botonNo.addEventListener(
        "click",
        function () {


            /* Ocultar la pregunta */

            contenedor.style.display =
                "none";


            /* Mostrar resultado */

            resultado.style.display =
                "flex";

        }
    );


</script>


</body>

</html>
